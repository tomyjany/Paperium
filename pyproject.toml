[project]
name = "codex-paper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.scripts]
paperctl = "paperctl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperctl"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
